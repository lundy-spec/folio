name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    name: Lint Logic/ for WoW globals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid WoW globals in Logic/
        run: |
          violation=0
          if [ -d Logic ]; then
            for f in $(find Logic -name '*.lua'); do
              if sed 's/--.*$//' "$f" | grep -InE '\b(C_[A-Za-z]+|CreateFrame|GetTime|UnitGUID|Enum|_G)\b'; then
                echo "::error::$f references a WoW global — Logic/ must be pure Lua."
                violation=1
              fi
            done
          fi
          if [ "$violation" = "1" ]; then exit 1; fi
          echo "Logic/ is clean."

  luacheck:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install luacheck
        run: luarocks install luacheck
      - name: Run luacheck
        run: luacheck Core Data Logic UI Tests

  test:
    name: busted specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install busted
        run: luarocks install busted
      - name: Run specs
        run: |
          if [ -d Tests/spec ] && [ -n "$(find Tests/spec -name '*_spec.lua')" ]; then
            busted Tests/spec
          else
            echo "No specs yet — skipping."
          fi
