name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    name: Lint Logic/ for WoW globals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Forbid WoW globals in Logic/
        run: |
          violation=0
          if [ -d Logic ]; then
            for f in $(find Logic -name '*.lua'); do
              if sed 's/--.*$//' "$f" | grep -InE '\b(C_[A-Za-z]+|CreateFrame|GetTime|UnitGUID|Enum|_G)\b'; then
                echo "::error::$f references a WoW global — Logic/ must be pure Lua."
                violation=1
              fi
            done
          fi
          if [ "$violation" = "1" ]; then exit 1; fi
          echo "Logic/ is clean."

  luacheck:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Lua from Ubuntu's own package mirrors rather than a download from
      # lua.org (leafo/gh-actions-lua), which intermittently timed out and
      # failed releases. Rock installs from luarocks.org are retried for
      # the same reason.
      - name: Install Lua 5.4 and LuaRocks
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq lua5.4 liblua5.4-dev luarocks
      - name: Install luacheck
        run: |
          for attempt in 1 2 3; do
            sudo luarocks --lua-version=5.4 install luacheck && exit 0
            echo "luarocks install failed (attempt $attempt), retrying..."; sleep 10
          done
          exit 1
      - name: Run luacheck
        run: luacheck Core Data Logic UI Tests

  test:
    name: busted specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Lua from Ubuntu's own package mirrors rather than a download from
      # lua.org (leafo/gh-actions-lua), which intermittently timed out and
      # failed releases. Rock installs from luarocks.org are retried for
      # the same reason.
      - name: Install Lua 5.4 and LuaRocks
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq lua5.4 liblua5.4-dev luarocks
      - name: Install busted
        run: |
          for attempt in 1 2 3; do
            sudo luarocks --lua-version=5.4 install busted && exit 0
            echo "luarocks install failed (attempt $attempt), retrying..."; sleep 10
          done
          exit 1
      - name: Run specs
        run: |
          if [ -d Tests/spec ] && [ -n "$(find Tests/spec -name '*_spec.lua')" ]; then
            busted Tests/spec
          else
            echo "No specs yet — skipping."
          fi
